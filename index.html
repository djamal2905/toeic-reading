<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>TOEIC Reading</title>
<meta name="description" content="Entraînement TOEIC Reading : Parties V, VI et VII, 100 questions en 75 minutes, correction détaillée.">
<style>:root{box-sizing:border-box}body{margin:0;padding:0}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap">
<style>
/* Concept : salle d'examen. Barre collante (chrono + progression), livret blanc en serif au centre,
   feuille de réponses OMR (bulles roses, remplies au graphite) à droite sur grand écran. */
:root{
  --paper:#EEF1F5; --sheet:#FFFFFF; --doc:#F6F8FA;
  --ink:#17212D; --ink-2:#4F5C6B; --rule:#D5DBE3;
  --omr:#C4485F; --graphite:#222B36;
  --hover:#EAEFF5; --sel:#E3EAF4; --focus:#1D5FD6;
  --ok:#17794A; --ok-bg:#E3F3EA; --bad:#B3261E; --bad-bg:#FBE7E5; --warn:#8F5200; --warn-bg:#FFF0D6;
  --serif:'Source Serif 4','Times New Roman',Georgia,serif;
  --sans:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#12171E; --sheet:#1A222C; --doc:#161D26;
    --ink:#E7ECF2; --ink-2:#A2AEBB; --rule:#2F3A47;
    --omr:#E7798D; --graphite:#E7ECF2;
    --hover:#222C38; --sel:#26364A; --focus:#7FB0FF;
    --ok:#5CC58C; --ok-bg:#153525; --bad:#FF8C84; --bad-bg:#3C1B19; --warn:#F2B04B; --warn-bg:#3A2A0E;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#12171E; --sheet:#1A222C; --doc:#161D26;
  --ink:#E7ECF2; --ink-2:#A2AEBB; --rule:#2F3A47;
  --omr:#E7798D; --graphite:#E7ECF2;
  --hover:#222C38; --sel:#26364A; --focus:#7FB0FF;
  --ok:#5CC58C; --ok-bg:#153525; --bad:#FF8C84; --bad-bg:#3C1B19; --warn:#F2B04B; --warn-bg:#3A2A0E;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{animation:none!important;transition:none!important}}
body{background:var(--paper);color:var(--ink);font:400 15px/1.5 var(--sans);-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--sheet)}
h1,h2,h3{margin:0;text-wrap:balance}
p{margin:0}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}

/* Barre */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--sheet);border-bottom:1px solid var(--rule)}
.bar-in{max-width:1120px;margin:0 auto;display:flex;flex-wrap:wrap;align-items:center;gap:8px 18px;padding-block:10px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{display:flex;flex-direction:column;line-height:1.15;margin-right:auto;min-width:0}
.brand b{font:600 .95rem var(--sans);letter-spacing:.02em}
.brand span{font:400 .75rem var(--sans);color:var(--ink-2)}
.clock{display:flex;align-items:center;gap:10px}
#tm{font:500 1.5rem/1 var(--mono);font-variant-numeric:tabular-nums;padding:6px 10px;border:1.5px solid var(--rule);border-radius:6px;min-width:5.4ch;text-align:center}
.clock[data-s="warn"] #tm{color:var(--warn);border-color:var(--warn);background:var(--warn-bg)}
.clock[data-s="crit"] #tm{color:var(--bad);border-color:var(--bad);background:var(--bad-bg)}
.clock.hid #tm{visibility:hidden}
.cs{display:flex;flex-direction:column;align-items:flex-start;line-height:1.2}
.cl{font:400 .72rem var(--sans);color:var(--ink-2)}
.prog{display:flex;align-items:center;gap:10px;flex:1 1 170px;min-width:0}
.prog span{font:500 .85rem var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.track{flex:1;height:6px;background:var(--rule);border-radius:3px;overflow:hidden;min-width:60px}
.track i{display:block;height:100%;width:0;background:var(--graphite);transition:width .2s}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.btn{appearance:none;border:1.5px solid var(--graphite);background:var(--graphite);color:var(--sheet);padding:8px 14px;border-radius:6px;font:600 .875rem var(--sans);cursor:pointer;min-height:40px}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.big{padding:13px 26px;font-size:1rem;min-height:48px}
.lnk{appearance:none;background:none;border:0;color:var(--ink-2);text-decoration:underline;cursor:pointer;font:400 .78rem var(--sans);padding:2px 0}
.confirm{background:var(--warn-bg);border-top:1px solid var(--rule)}
.confirm .bar-in{padding-block:8px}
.confirm p{font-weight:500;color:var(--warn);margin-right:auto}

/* Mise en page */
.wrap{max-width:1120px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr);gap:20px;align-items:start;padding-block:20px 64px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.omr{display:none}
@media (min-width:1000px){
  .wrap.has-omr{grid-template-columns:minmax(0,1fr) 236px}
  .omr{display:block;position:sticky;top:calc(env(safe-area-inset-top,0px) + 84px);max-height:calc(100vh - 110px);overflow:auto;background:var(--sheet);border:1px solid var(--rule);padding:12px 12px 14px}
}
.booklet{background:var(--sheet);border:1px solid var(--rule);padding:4px clamp(14px,3vw,34px) 22px;min-width:0}
.part+.part{margin-top:30px;border-top:2px solid var(--ink)}
.ph{padding-top:22px}
.kick{font:500 .75rem var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--omr)}
.ph h2{font:600 1.35rem/1.2 var(--sans);margin-top:4px}
.dir{font:italic 400 1rem/1.5 var(--serif);margin-top:10px;max-width:62ch}
.fr{font-size:.85rem;color:var(--ink-2);margin-top:4px;max-width:62ch}

.part{scroll-margin-top:96px}
.bd{font:500 .8rem var(--mono);color:var(--omr);margin-top:8px}
.pn{display:flex;gap:4px}
.pn button{appearance:none;border:1.5px solid var(--rule);background:transparent;padding:6px 10px;border-radius:6px;font:600 .8rem var(--mono);cursor:pointer;min-height:36px}
.pn button:hover{background:var(--hover)}
/* Questions */
.qs{list-style:none;margin:16px 0 0;padding:0}
.q{display:grid;grid-template-columns:3rem minmax(0,1fr);padding-block:14px;border-top:1px solid var(--rule);scroll-margin-top:100px;transition:background .4s}
.q.flash{background:var(--warn-bg)}
.qn{font:500 .95rem/1.7 var(--mono);color:var(--ink-2)}
.qt{font:400 1.1rem/1.55 var(--serif);margin-bottom:6px;max-width:68ch}
.gap{display:inline-block;width:4em;height:1em;border-bottom:2px solid var(--ink);margin:0 .2em;vertical-align:-.1em}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:2px 12px}
.opts.long{grid-template-columns:minmax(0,1fr)}
@media (max-width:479px){.opts{grid-template-columns:minmax(0,1fr)}}
.opt{appearance:none;display:flex;gap:10px;align-items:flex-start;text-align:left;width:100%;min-height:44px;padding:8px 10px;border:1px solid transparent;border-radius:6px;background:none;cursor:pointer}
.opt:hover{background:var(--hover)}
.opt[aria-pressed="true"]{background:var(--sel);border-color:var(--rule)}
.bub{flex:none;width:26px;height:26px;border-radius:50%;border:1.5px solid var(--omr);color:var(--omr);display:grid;place-items:center;font:500 12px/1 var(--mono)}
.opt[aria-pressed="true"] .bub{background:var(--graphite);border-color:var(--graphite);color:var(--sheet)}
.ot{font:400 1.05rem/1.4 var(--serif);padding-top:2px;min-width:0;overflow-wrap:anywhere}

/* Textes (Part 6) */
.doc{background:var(--doc);border:1px solid var(--rule);padding:16px clamp(14px,2.5vw,26px);margin-top:18px;font:400 1.05rem/1.65 var(--serif)}
.dk{font:500 .72rem var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2);margin-bottom:8px}
.meta{font:400 .85rem/1.5 var(--mono);color:var(--ink-2);margin-bottom:12px;padding-bottom:10px;border-bottom:1px solid var(--rule);overflow-wrap:anywhere}
.doc h3{font:600 1.2rem/1.3 var(--serif);margin-bottom:8px}
.doc p+p{margin-top:.8em}
.blank{display:inline-flex;justify-content:center;min-width:4.4em;border-bottom:2px solid var(--ink);margin:0 .2em;padding:0 .3em}
.blank i{font:500 .8rem var(--mono);font-style:normal}
.blank.done{background:var(--sel);border-bottom-color:var(--omr)}
.pq{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 28px;margin-top:6px}
.pq .q.ins{grid-column:1/-1}
@media (max-width:759px){.pq{grid-template-columns:minmax(0,1fr)}}
.pq .q{border-top:1px solid var(--rule)}

/* Feuille OMR */
.omr h2{font:500 .78rem var(--mono);letter-spacing:.1em;text-transform:uppercase;margin-bottom:6px}
.omr .sec{font:500 .7rem var(--mono);color:var(--ink-2);margin:12px 0 4px;letter-spacing:.08em}
.row{appearance:none;display:grid;grid-template-columns:2.3rem repeat(4,16px);gap:6px;align-items:center;width:100%;padding:2px 4px;border:0;background:none;border-radius:4px;cursor:pointer;text-align:left}
.row:hover{background:var(--hover)}
.row .n{font:500 .72rem var(--mono);color:var(--ink-2)}
.row .b{width:16px;height:16px;border-radius:50%;border:1.2px solid var(--omr);display:grid;place-items:center;font:500 8px/1 var(--mono);color:var(--omr)}
.row .b.on{background:var(--graphite);border-color:var(--graphite);color:var(--sheet)}

/* Accueil */
.start{max-width:780px;margin:0 auto;padding-block:44px 72px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.start h1{font:600 clamp(1.9rem,5vw,2.75rem)/1.1 var(--sans);letter-spacing:-.015em;margin-top:8px}
.lead{font:400 1.05rem/1.6 var(--serif);max-width:60ch;margin-top:14px;color:var(--ink)}
fieldset{border:0;margin:28px 0 0;padding:0;min-width:0}
legend{font:500 .75rem var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2);padding:0;margin-bottom:10px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.tile{position:relative;display:block;cursor:pointer}
.tile input{position:absolute;opacity:0;inset:0;width:100%;height:100%;margin:0;cursor:pointer}
.tin{display:flex;flex-direction:column;gap:2px;height:100%;padding:12px 14px;background:var(--sheet);border:1.5px solid var(--rule);border-radius:6px}
.tin b{font:600 1.05rem var(--sans)}
.tin span{font-size:.85rem;color:var(--ink-2)}
.tin em{font:500 .85rem var(--mono);font-style:normal;margin-top:6px}
.tile input:checked+.tin{border-color:var(--graphite);box-shadow:inset 0 0 0 1px var(--graphite);background:var(--sel)}
.tile input:focus-visible+.tin{outline:2px solid var(--focus);outline-offset:2px}
.go{display:flex;flex-wrap:wrap;align-items:center;gap:12px 18px;margin-top:30px}
.tl{font:500 .95rem var(--mono)}
.note{margin-top:26px;font-size:.85rem;color:var(--ink-2);max-width:62ch}
.hs{font:500 .75rem var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2);margin-top:36px}
.hist{list-style:none;margin:10px 0 0;padding:0;border-top:1px solid var(--rule)}
.hist li{display:grid;grid-template-columns:5.5rem minmax(0,1fr) 5rem 4.5rem;gap:10px;padding:8px 0;border-bottom:1px solid var(--rule);font:400 .9rem var(--mono);font-variant-numeric:tabular-nums}
.hist b{font-weight:500}

/* Résultats */
.sum{background:var(--sheet);border:1px solid var(--rule);padding:22px clamp(14px,3vw,34px);display:grid;grid-template-columns:minmax(0,1fr);gap:24px}
@media (min-width:860px){.sum{grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr);gap:40px}}
.sc{font:500 clamp(3.5rem,12vw,5.5rem)/1 var(--mono);font-variant-numeric:tabular-nums}
.of{font:400 1.5rem var(--mono);color:var(--ink-2);margin-left:.2em}
.rsm{margin-top:10px;color:var(--ink-2);font-size:.92rem}
.rsm b{color:var(--ink);font-weight:600}
.tmo{margin-top:12px;padding:8px 12px;background:var(--warn-bg);color:var(--warn);font-weight:500;border-radius:4px}
.sum h2{font:500 .75rem var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2);margin-bottom:10px}
.tbs{display:grid;gap:9px}
.tb{display:grid;grid-template-columns:minmax(7rem,11.5rem) minmax(0,1fr) 3.4rem;gap:10px;align-items:center;font-size:.9rem}
.tb .bt{height:8px;background:var(--rule);border-radius:4px;overflow:hidden}
.tb .bt i{display:block;height:100%;background:var(--ok)}
.tb[data-lv="mid"] .bt i{background:var(--warn)}
.tb[data-lv="lo"] .bt i{background:var(--bad)}
.tb .v{font:500 .85rem var(--mono);text-align:right;font-variant-numeric:tabular-nums}
.pts{display:grid;gap:4px;margin-bottom:18px;font-size:.92rem}
.pts div{display:flex;justify-content:space-between;gap:12px;border-bottom:1px solid var(--rule);padding-bottom:4px}
.pts b{font:500 .9rem var(--mono)}
.rvh{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 16px;margin-top:6px}
.rvh h2{font:600 1.35rem/1.2 var(--sans)}
.seg{display:flex}
.seg button{appearance:none;border:1.5px solid var(--graphite);background:transparent;padding:7px 14px;font:600 .85rem var(--sans);cursor:pointer;min-height:38px}
.seg button:first-child{border-radius:6px 0 0 6px}
.seg button:last-child{border-radius:0 6px 6px 0;border-left:0}
.seg button[aria-pressed="true"]{background:var(--graphite);color:var(--sheet)}
.rvl{list-style:none;margin:14px 0 0;padding:0}
.rv{display:grid;grid-template-columns:3rem minmax(0,1fr);border-top:1px solid var(--rule);padding:14px 0}
.top{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;margin-bottom:6px}
.st{font:600 .75rem var(--sans);padding:2px 9px;border-radius:999px}
.st.ok{background:var(--ok-bg);color:var(--ok)}
.st.bad{background:var(--bad-bg);color:var(--bad)}
.st.none{background:var(--hover);color:var(--ink-2)}
.chip{font:500 .72rem var(--sans);color:var(--ink-2);border:1px solid var(--rule);padding:1px 9px;border-radius:999px}
.rvo{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:3px}
.rvo li{display:flex;gap:10px;align-items:baseline;font:400 1rem/1.4 var(--serif);padding:5px 8px;border-radius:4px}
.rvo li.is-ok{background:var(--ok-bg)}
.rvo li.is-bad{background:var(--bad-bg)}
.rvo .lt{font:500 .8rem var(--mono);color:var(--ink-2);flex:none;width:1.2rem}
.rvo .tg{margin-left:auto;padding-left:8px;font:600 .72rem var(--sans);white-space:nowrap}
.rvo .is-ok .tg{color:var(--ok)}
.rvo .is-bad .tg{color:var(--bad)}
.ex{margin-top:10px;font:400 .92rem/1.55 var(--sans);max-width:68ch}
mark.fill{background:var(--ok-bg);color:inherit;padding:0 .2em;border-bottom:2px solid var(--ok)}
mark.fill sup{font:500 .65rem var(--mono);margin-right:.25em;color:var(--ink-2)}
.pv{margin-top:6px}
.only-wrong .rv.ok{display:none}
.only-wrong .pv.allok{display:none}
.review .part{margin-top:0}
@media (max-width:479px){
  .bar-in{gap:6px 12px}
  #tm{font-size:1.25rem}
  .hist li{grid-template-columns:4rem minmax(0,1fr) 3.5rem;font-size:.8rem}
  .hist li span:last-child{display:none}
  .tb{grid-template-columns:minmax(0,7.5rem) minmax(0,1fr) 3rem;font-size:.82rem}
  .q,.rv{grid-template-columns:2.4rem minmax(0,1fr)}
}
</style>
</head>
<body>

<div id="app"></div>

<script>
(function(){
"use strict";

var T={g:"Grammaire",w:"Forme du mot",v:"Vocabulaire",c:"Prépositions & connecteurs",s:"Insertion de phrase"};
var L="ABCD";
var KEY="toeic56-hist";
var PACE={exam:{label:"Examen",f:1},soft:{label:"Souple",f:1.5},free:{label:"Sans limite",f:0}};
var BASE={p5:660,p6:540,p7:3300};
function f(tag,q,o,e){return {tag:tag,q:q,o:o,e:e};}

/* La bonne réponse est toujours en premier dans o : les choix sont mélangés à chaque essai. */
var P5=[
f(T.w,"Applicants who fail to submit all required documents by the deadline will not be ------- for the scholarship.",["considered","consideration","considerate","considering"],"Après « will not be », il faut un participe passé (passif) : « be considered for ». Consideration est un nom, considerate signifie « attentionné »."),
f(T.c,"------- the unexpected delay at customs, the shipment arrived at the warehouse two days ahead of the revised schedule.",["Despite","Even though","Because","Whereas"],"« Despite » se construit avec un groupe nominal (the unexpected delay). Even though, Because et Whereas introduisent une proposition avec sujet et verbe."),
f(T.g,"Mr. Duval asked that the report ------- to the legal department before it is circulated to shareholders.",["be sent","is sent","sends","was sent"],"Après un verbe de demande (ask, require, recommend, insist) suivi de that, on emploie le subjonctif : la base verbale, ici « be sent »."),
f(T.g,"Rarely ------- such a detailed proposal been submitted by a first-time bidder.",["has","is","have","does"],"Après l'adverbe négatif « Rarely », l'auxiliaire passe devant le sujet : « has + proposal + been submitted ». Le sujet est singulier, donc has (pas have)."),
f(T.g,"Neither the project manager nor the engineers ------- aware of the change in the specifications until Monday.",["were","was","is","has been"],"Avec « neither… nor », le verbe s'accorde avec le sujet le plus proche (the engineers, pluriel). « Until Monday » renvoie au passé : were."),
f(T.g,"Had the company invested in staff training earlier, it ------- the costly errors that occurred last quarter.",["would have avoided","would avoid","will avoid","avoided"],"« Had + participe passé » est un conditionnel passé inversé (= If the company had invested). La principale prend « would have + participe passé »."),
f(T.g,"The new hybrid work policy applies to ------- employees who have completed the probationary period.",["all","every","each","another"],"« Employees » est au pluriel : seul all convient. Every, each et another se placent devant un nom singulier."),
f(T.w,"Ms. Tanaka is ------- the most experienced negotiator in the firm.",["easily","easy","ease","easier"],"Il faut un adverbe pour renforcer le superlatif : « easily the most experienced » (de loin la plus expérimentée)."),
f(T.c,"The warranty remains valid ------- the product is used in accordance with the instructions.",["as long as","so that","in case","even if"],"« As long as » = à condition que. So that exprime le but, in case = au cas où, even if = même si (ce qui contredit l'idée de condition)."),
f(T.c,"Customers must present a receipt; -------, they will not be eligible for a refund.",["otherwise","likewise","meanwhile","furthermore"],"Après un point-virgule, « otherwise » (sinon) introduit la conséquence négative. Likewise (de même), meanwhile (pendant ce temps) et furthermore (de plus) n'ont pas ce sens."),
f(T.w,"The winners are ------- to be announced at the gala on Friday.",["expected","expecting","expectation","expectant"],"Les gagnants ne peuvent pas « attendre » ici : le sens est passif, « be expected to + verbe » (devoir être annoncés). Expecting serait actif."),
f(T.g,"------- of the three proposals submitted by the vendors met the minimum technical requirements.",["None","Neither","No","Nothing"],"« None of the three » : pronom pour plus de deux éléments. Neither ne s'emploie que pour deux ; No et Nothing ne se combinent pas avec « of the »."),
f(T.c,"Mr. Reyes was promoted to regional director ------- his consistently outstanding sales performance.",["owing to","in spite","as though","in case of"],"« Owing to » = en raison de, suivi d'un groupe nominal. « In spite » exigerait « of », « as though » introduit une proposition, « in case of » (en cas de) est illogique ici."),
f(T.g,"The vendor ------- bid was the lowest was disqualified for incomplete paperwork.",["whose","who","which","whom"],"Le lien de possession (the vendor's bid) se traduit par le relatif possessif « whose », suivi d'un nom."),
f(T.v,"The airline offered passengers vouchers as ------- for the inconvenience caused by the cancellation.",["compensation","competition","compliance","completion"],"« Compensation » = dédommagement. Competition (concurrence), compliance (conformité) et completion (achèvement) ne conviennent pas."),
f(T.v,"The CEO is known for her ------- attention to detail, which has earned the trust of investors.",["meticulous","hesitant","abundant","reluctant"],"« Meticulous » = minutieux, qui s'associe naturellement à « attention to detail ». Hesitant et reluctant expriment une réticence ; abundant = abondant."),

var BOOKS={"1":{p5:P5,p6:P6},"2":{p5:P5b,p6:P6b},"3":{p5:P5c,p6:P6c},"4":{p5:P5d,p6:P6d}};
function pool(book,k){
  if(book==="mix")return [].concat(BOOKS["1"][k],BOOKS["2"][k],BOOKS["3"][k],BOOKS["4"][k]);
  return BOOKS[book][k];
}
function bookLabel(b){return b==="mix"?"Mélange":"Livre "+(b||"1");}

/* Utilitaires */
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function typo(s){return String(s).replace(/'/g,"’");}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function pad(n){return (n<10?"0":"")+n;}
function fmt(s){return pad(Math.floor(s/60))+":"+pad(s%60);}
function loadHist(){try{return JSON.parse(localStorage.getItem(KEY)||"[]");}catch(e){return [];}}
function saveHist(){try{var h=loadHist();h.unshift({d:Date.now(),book:S.book,part:S.part,pace:S.pace,ok:S.ok,n:S.qs.length,sec:S.elapsed});localStorage.setItem(KEY,JSON.stringify(h.slice(0,8)));}catch(e){}}
function partsOf(part){return part==="all"?[5,6,7]:(part==="p56"||part==="both")?[5,6]:part==="p5"?[5]:part==="p6"?[6]:[7];}
function budgetOf(p,pace){var k=PACE[pace].f;return k?Math.round(BASE["p"+p]*k/60)*60:0;}
function limitFor(part,pace){return partsOf(part).reduce(function(a,p){return a+budgetOf(p,pace);},0);}
function partLabel(p){return {all:"Parties V à VII",p56:"Parties V + VI",both:"Parties V + VI",p5:"Partie V",p6:"Partie VI",p7:"Partie VII"}[p]||"Partie V";}

var app=document.getElementById("app");
var S=null,iv=null,setup={part:"all",pace:"exam",book:"1"};

/* Construction d'une session */
function mkOpts(arr){return shuffle(arr.map(function(t,i){return {t:t,ok:i===0};}));}
function build(part,book){
  var qs=[],groups=[],n=101;
  if(partsOf(part).indexOf(5)>-1){
    var g5={type:5,qs:[]};
    shuffle(pool(book,"p5")).slice(0,30).forEach(function(it){
      var q={i:qs.length,n:n++,part:5,tag:it.tag,text:it.q,opts:mkOpts(it.o),e:it.e,ans:null};
      qs.push(q);g5.qs.push(q);
    });
    groups.push(g5);
  }
  if(partsOf(part).indexOf(6)>-1){
    n=131;
    var g6={type:6,passages:[]};
    shuffle(pool(book,"p6")).slice(0,4).forEach(function(p){
      var pp={kind:p.kind,title:p.title,head:p.head,paras:p.paras,qs:[]};
      p.qs.forEach(function(it){
        var q={i:qs.length,n:n++,part:6,tag:it.tag,ins:it.tag===T.s,opts:mkOpts(it.o),e:it.e,ans:null};
        qs.push(q);pp.qs.push(q);
      });
      g6.passages.push(pp);
    });
    groups.push(g6);
  }
  if(partsOf(part).indexOf(7)>-1){
    n=147;
    var g7={type:7,passages:[]};
    shuffle(P7).sort(function(a,b){return a.docs.length-b.docs.length;}).forEach(function(p){
      var pp={docs:p.docs,qs:[]};
      p.qs.forEach(function(it){
        var q={i:qs.length,n:n++,part:7,tag:it.tag,text:it.q,opts:mkOpts(it.o),e:it.e,ans:null};
        qs.push(q);pp.qs.push(q);
      });
      g7.passages.push(pp);
    });
    groups.push(g7);
  }
  return {qs:qs,groups:groups};
}

/* Écran d'accueil */
function timeLabel(part,pace){var s=limitFor(part,pace);return s?Math.round(s/60)+" min":"Sans limite";}
function tile(name,val,title,sub,checked,timeAttr){
  return '<label class="tile"><input type="radio" name="'+name+'" value="'+val+'"'+(checked?" checked":"")+'><span class="tin"><b>'+title+'</b><span>'+sub+'</span>'+(timeAttr?'<em data-t="'+val+'">'+timeLabel(val,setup.pace)+'</em>':'')+'</span></label>';
}
function renderStart(){
  clearInterval(iv);S=null;
  var hist=loadHist();
  var h='<div class="start"><p class="kick">TOEIC · Reading</p><h1>Parties V, VI et VII</h1>'+
  '<p class="lead">Le format de l’épreuve réelle : 100 questions en 75 minutes. Phrases à compléter (30), textes à trous (16), puis compréhension de documents simples, doubles et triples (54). Tu coches une réponse par question, le chrono tourne, la correction détaillée s’affiche à la fin. Les lettres des choix sont mélangées à chaque essai.</p>'+
  '<fieldset><legend>Livre</legend><div class="tiles">'+
   tile("book","1","Livre 1","30 phrases · 4 textes",setup.book==="1",false)+
   tile("book","2","Livre 2","30 phrases · 4 textes",setup.book==="2",false)+
   tile("book","3","Livre 3","30 phrases · 4 textes",setup.book==="3",false)+
   tile("book","4","Livre 4","30 phrases · 4 textes · niveau difficile",setup.book==="4",false)+
   tile("book","mix","Mélange","Tirage au hasard dans les 4 livres",setup.book==="mix",false)+
  '</div></fieldset>'+
  '<fieldset><legend>Épreuve</legend><div class="tiles">'+
   tile("part","all","V + VI + VII","100 questions · épreuve complète",setup.part==="all",true)+
   tile("part","p56","V + VI","46 questions · Q101 à Q146",setup.part==="p56",true)+
   tile("part","p5","Partie V","30 questions · phrases à compléter",setup.part==="p5",true)+
   tile("part","p6","Partie VI","16 questions · 4 textes à trous",setup.part==="p6",true)+
   tile("part","p7","Partie VII","54 questions · 29 simples, 10 doubles, 15 triples",setup.part==="p7",true)+
  '</div></fieldset>'+
  '<fieldset><legend>Rythme</legend><div class="tiles">'+
   tile("pace","exam","Examen","75 min : 11 V · 9 VI · 55 VII",setup.pace==="exam")+
   tile("pace","soft","Souple","50 % de temps en plus",setup.pace==="soft")+
   tile("pace","free","Sans limite","Le chrono compte le temps passé",setup.pace==="free")+
  '</div></fieldset>'+
  '<div class="go"><button type="button" class="btn big" data-act="start">Commencer</button><p class="tl" id="tl"></p></div>'+
  '<p class="note">Les questions sont originales, écrites dans l’esprit du TOEIC (grammaire, formes de mots, vocabulaire, connecteurs, insertion de phrase). Elles ne reprennent aucun sujet officiel. La Partie VII est commune aux 4 livres (10 textes simples, 2 doubles, 3 triples), avec l’ordre et les lettres mélangés.</p>';
  if(hist.length){
    h+='<p class="hs">Derniers essais</p><ul class="hist">'+hist.map(function(x){
      var d=new Date(x.d).toLocaleDateString("fr-FR",{day:"numeric",month:"short"});
      return '<li><span>'+esc(d)+'</span><span>'+esc(bookLabel(x.book)+" · "+partLabel(x.part))+'</span><b>'+x.ok+"/"+x.n+'</b><span>'+fmt(x.sec)+'</span></li>';
    }).join("")+'</ul>';
  }
  h+='</div>';
  app.innerHTML=h;
  refreshTimes();
  window.scrollTo(0,0);
}
function refreshTimes(){
  var els=app.querySelectorAll("[data-t]");
  for(var i=0;i<els.length;i++){els[i].textContent=timeLabel(els[i].getAttribute("data-t"),setup.pace);}
  var tl=document.getElementById("tl");
  if(tl){var s=limitFor(setup.part,setup.pace);tl.textContent=s?"Temps imparti : "+fmt(s):"Sans limite de temps";}
}

/* Épreuve */
function optsHTML(q){
  var long=q.opts.some(function(o){return o.t.length>46;});
  return '<div class="opts'+(long?" long":"")+'" role="group" aria-label="Choix pour la question '+q.n+'">'+
    q.opts.map(function(o,k){
      return '<button type="button" class="opt" data-q="'+q.i+'" data-k="'+k+'" aria-pressed="'+(q.ans===k)+'"><span class="bub">'+L[k]+'</span><span class="ot">'+esc(typo(o.t))+'</span></button>';
    }).join("")+'</div>';
}
function gapText(t,fill){
  var s=esc(typo(t));
  return s.replace("-------",fill?'<mark class="fill">'+esc(typo(fill))+'</mark>':'<span class="gap" aria-label="blank"></span>');
}
function docHTML(p,filled){
  var h='<div class="doc"><p class="dk">'+esc(p.kind)+'</p>';
  if(p.head&&p.head.length)h+='<div class="meta">'+p.head.map(function(x){return esc(typo(x));}).join("<br>")+'</div>';
  if(p.title)h+='<h3>'+esc(typo(p.title))+'</h3>';
  h+=p.paras.map(function(t){
    return '<p>'+esc(typo(t)).replace(/\n/g,"<br>").replace(/\{(\d+)\}/g,function(m,k){
      var q=p.qs[(+k-1)%4];
      if(filled){var c=q.opts.filter(function(o){return o.ok;})[0].t;return '<mark class="fill"><sup>'+q.n+'</sup>'+esc(typo(c))+'</mark>';}
      return '<span class="blank" id="b'+q.n+'"><i>'+q.n+'</i></span>';
    })+'</p>';
  }).join("");
  return h+'</div>';
}
function budgetHTML(g){return g.budget?'<p class="bd">Temps conseillé : '+Math.round(g.budget/60)+' min · à terminer avant '+fmt(g.endAt)+'</p>':"";}
function docPlain(d,label){
  var h='<div class="doc"><p class="dk">'+(label?esc(label)+" · ":"")+esc(d.kind)+'</p>';
  if(d.head&&d.head.length)h+='<div class="meta">'+d.head.map(function(x){return esc(typo(x));}).join("<br>")+'</div>';
  if(d.title)h+='<h3>'+esc(typo(d.title))+'</h3>';
  h+=d.paras.map(function(t){return '<p>'+esc(typo(t)).replace(/\n/g,"<br>")+'</p>';}).join("");
  return h+'</div>';
}
function docsHTML(p){return p.docs.map(function(d,i){return docPlain(d,p.docs.length>1?"Texte "+(i+1):"");}).join("");}
function part7HTML(g){
  var nq=g.passages.reduce(function(a,p){return a+p.qs.length;},0);
  var h='<section class="part" id="part7"><div class="ph"><p class="kick">Part 7</p><h2>Reading Comprehension</h2>'+
  '<p class="dir">Directions: Read the texts. Choose the best answer for each question.</p>'+
  '<p class="fr">Questions 147 à '+(146+nq)+' · textes simples, puis doubles, puis triples.</p>'+budgetHTML(g)+'</div>';
  g.passages.forEach(function(p){
    h+=docsHTML(p)+'<ol class="qs">'+p.qs.map(function(q){
      return '<li class="q" id="q'+q.n+'"><span class="qn">'+q.n+'</span><div><p class="qt">'+esc(typo(q.text))+'</p>'+optsHTML(q)+'</div></li>';
    }).join("")+'</ol>';
  });
  return h+'</section>';
}
function part5HTML(g){
  return '<section class="part" id="part5"><div class="ph"><p class="kick">Part 5</p><h2>Incomplete Sentences</h2>'+
  '<p class="dir">Directions: Choose the word or phrase that best completes each sentence.</p>'+
  '<p class="fr">Questions 101 à 130 · une seule réponse par question, tu peux décocher en recliquant.</p>'+budgetHTML(g)+'</div>'+
  '<ol class="qs">'+g.qs.map(function(q){
    return '<li class="q" id="q'+q.n+'"><span class="qn">'+q.n+'</span><div><p class="qt">'+gapText(q.text)+'</p>'+optsHTML(q)+'</div></li>';
  }).join("")+'</ol></section>';
}
function part6HTML(g){
  var h='<section class="part" id="part6"><div class="ph"><p class="kick">Part 6</p><h2>Text Completion</h2>'+
  '<p class="dir">Directions: Read each text. Choose the word, phrase or sentence that best fills each numbered blank.</p>'+
  '<p class="fr">Questions 131 à 146 · quatre textes, quatre blancs par texte.</p>'+budgetHTML(g)+'</div>';
  g.passages.forEach(function(p){
    h+=docHTML(p,false)+'<div class="pq">'+p.qs.map(function(q){
      return '<div class="q'+(q.ins?" ins":"")+'" id="q'+q.n+'" role="group" aria-label="Question '+q.n+'"><span class="qn">'+q.n+'</span><div>'+optsHTML(q)+'</div></div>';
    }).join("")+'</div>';
  });
  return h+'</section>';
}
function sheetHTML(){
  var h='<aside class="omr" aria-label="Feuille de réponses"><h2>Feuille de réponses</h2>';
  S.groups.forEach(function(g){
    var qs=g.type===5?g.qs:g.passages.reduce(function(a,p){return a.concat(p.qs);},[]);
    h+='<div class="sec">PART '+g.type+'</div>';
    qs.forEach(function(q){
      h+='<button type="button" class="row" data-jump="'+q.n+'" id="sr'+q.i+'" aria-label="Aller à la question '+q.n+'"><span class="n">'+q.n+'</span>'+
        [0,1,2,3].map(function(k){return '<span class="b'+(q.ans===k?" on":"")+'">'+L[k]+'</span>';}).join("")+'</button>';
    });
  });
  return h+'</aside>';
}
function renderTest(){
  var body="";
  S.groups.forEach(function(g){body+=g.type===5?part5HTML(g):g.type===6?part6HTML(g):part7HTML(g);});
  app.innerHTML='<header class="bar"><div class="bar-in">'+
    '<div class="brand"><b>TOEIC Reading</b><span>'+bookLabel(S.book)+' · '+partLabel(S.part)+' · '+PACE[S.pace].label+'</span></div>'+
    '<div class="clock" id="ck" data-s="ok"><span id="tm" role="timer" aria-live="off">'+fmt(S.limit||0)+'</span><span class="cs"><span class="cl">'+(S.limit?"restant":"écoulé")+'</span><span class="cl" id="pz"></span><button type="button" class="lnk" data-act="tg">Masquer</button></span></div>'+
    '<div class="pn" aria-label="Aller à une partie">'+S.groups.map(function(g){return '<button type="button" data-part="'+g.type+'">'+({5:"V",6:"VI",7:"VII"}[g.type])+'</button>';}).join("")+'</div>'+
    '<div class="prog"><span id="cnt"></span><div class="track"><i id="pb"></i></div></div>'+
    '<div class="acts"><button type="button" class="btn ghost" data-act="next">Sans réponse</button><button type="button" class="btn" data-act="fin">Terminer</button></div>'+
    '</div><div class="confirm" id="cf" hidden><div class="bar-in"><p id="cfn"></p><div class="acts"><button type="button" class="btn ghost" data-act="finno">Continuer</button><button type="button" class="btn" data-act="finyes">Terminer quand même</button></div></div></div></header>'+
    '<div class="wrap has-omr"><main class="booklet">'+body+'</main>'+sheetHTML()+'</div>';
  updateProgress();
  window.scrollTo(0,0);
}
function startTest(){
  var b=build(setup.part,setup.book);
  var cum=0;
  b.groups.forEach(function(g){var bd=budgetOf(g.type,setup.pace);cum+=bd;g.budget=bd;g.endAt=cum;});
  S={qs:b.qs,groups:b.groups,part:setup.part,pace:setup.pace,book:setup.book,limit:limitFor(setup.part,setup.pace),t0:Date.now(),done:false};
  renderTest();
  clearInterval(iv);iv=setInterval(tick,500);tick();
}
function updateProgress(){
  var a=S.qs.filter(function(q){return q.ans!==null;}).length,n=S.qs.length;
  var c=document.getElementById("cnt"),p=document.getElementById("pb");
  if(c)c.textContent=a+"/"+n;
  if(p)p.style.width=(a/n*100)+"%";
}
function sync(q){
  var bs=app.querySelectorAll('.opt[data-q="'+q.i+'"]');
  for(var i=0;i<bs.length;i++)bs[i].setAttribute("aria-pressed",String(+bs[i].getAttribute("data-k")===q.ans));
  var bl=document.getElementById("b"+q.n);if(bl)bl.classList.toggle("done",q.ans!==null);
  var sr=document.getElementById("sr"+q.i);
  if(sr){var cs=sr.querySelectorAll(".b");for(var k=0;k<cs.length;k++)cs[k].classList.toggle("on",q.ans===k);}
}
function pick(el){
  if(!S||S.done)return;
  var q=S.qs[+el.getAttribute("data-q")],k=+el.getAttribute("data-k");
  q.ans=(q.ans===k)?null:k;
  sync(q);updateProgress();
}
function goto(n){
  var t=document.getElementById("q"+n);if(!t)return;
  t.scrollIntoView({block:"start"});
  t.classList.add("flash");setTimeout(function(){t.classList.remove("flash");},1400);
}
function tick(){
  if(!S||S.done)return;
  var el=Math.floor((Date.now()-S.t0)/1000);
  var tm=document.getElementById("tm"),ck=document.getElementById("ck");
  if(S.limit){
    var left=S.limit-el;
    if(left<=0){finish(true);return;}
    if(tm)tm.textContent=fmt(left);
    if(ck)ck.setAttribute("data-s",left<=60?"crit":(left/S.limit<=0.2?"warn":"ok"));
    var pz=document.getElementById("pz");
    if(pz){var gg=S.groups.filter(function(g){return el<g.endAt;})[0];pz.textContent=gg?"Partie "+({5:"V",6:"VI",7:"VII"}[gg.type])+" : "+fmt(gg.endAt-el)+" conseillé":"";}
  }else if(tm){tm.textContent=fmt(el);}
}
function finish(timeout){
  if(!S||S.done)return;
  S.done=true;S.timeout=!!timeout;clearInterval(iv);
  var el=Math.floor((Date.now()-S.t0)/1000);
  S.elapsed=S.limit?Math.min(el,S.limit):el;
  renderResults();saveHist();
}

/* Résultats */
function rvHTML(q,withText){
  var right=0;q.opts.forEach(function(o,k){if(o.ok)right=k;});
  var st=q.ans===null?["none","– Sans réponse"]:q.good?["ok","✓ Correct"]:["bad","✗ Incorrect"];
  var h='<li class="rv '+(q.good?"ok":"no")+'"><span class="qn">'+q.n+'</span><div><div class="top"><span class="st '+st[0]+'">'+st[1]+'</span><span class="chip">'+esc(q.tag)+'</span></div>';
  if(withText)h+='<p class="qt">'+gapText(q.text,q.opts[right].t)+'</p>';
  h+='<ul class="rvo">'+q.opts.map(function(o,k){
    var cls=o.ok?"is-ok":(q.ans===k?"is-bad":"");
    var tg=o.ok?(q.ans===k?"✓ Ta réponse":"✓ Bonne réponse"):(q.ans===k?"✗ Ta réponse":"");
    return '<li class="'+cls+'"><span class="lt">'+L[k]+'</span><span>'+esc(typo(o.t))+'</span>'+(tg?'<span class="tg">'+tg+'</span>':"")+'</li>';
  }).join("")+'</ul><p class="ex">'+esc(typo(q.e))+'</p></div></li>';
  return h;
}
function renderResults(){
  var qs=S.qs;
  qs.forEach(function(q){q.good=q.ans!==null&&q.opts[q.ans].ok;});
  var n=qs.length,ok=qs.filter(function(q){return q.good;}).length;
  var blank=qs.filter(function(q){return q.ans===null;}).length;
  var wrong=n-ok;
  S.ok=ok;
  var pct=Math.round(ok/n*100);
  var parts={5:{ok:0,n:0},6:{ok:0,n:0},7:{ok:0,n:0}},tags={};
  qs.forEach(function(q){
    parts[q.part].n++;if(q.good)parts[q.part].ok++;
    tags[q.tag]=tags[q.tag]||{ok:0,n:0};tags[q.tag].n++;if(q.good)tags[q.tag].ok++;
  });
  var tagRows=Object.keys(tags).map(function(k){return {k:k,ok:tags[k].ok,n:tags[k].n,r:tags[k].ok/tags[k].n};})
    .sort(function(a,b){return a.r-b.r||b.n-a.n;});
  var h='<header class="bar"><div class="bar-in"><div class="brand"><b>TOEIC Reading</b><span>Correction · '+bookLabel(S.book)+' · '+partLabel(S.part)+'</span></div>'+
    '<div class="acts"><button type="button" class="btn" data-act="again">Nouvel essai</button></div></div></header><div class="wrap"><div>';
  h+='<section class="sum"><div><p class="kick">Score</p><p><span class="sc">'+ok+'</span><span class="of">/ '+n+'</span></p>'+
    '<p class="rsm"><b>'+pct+' %</b> de bonnes réponses · '+(blank?blank+" sans réponse · ":"")+'<b>'+fmt(S.elapsed)+'</b>'+(S.limit?" sur "+fmt(S.limit):"")+' · '+Math.round(S.elapsed/n)+' s par question</p>'+
    (S.timeout?'<p class="tmo">Temps écoulé : les questions non cochées comptent comme fausses.</p>':"")+'</div>'+
    '<div><h2>Par partie</h2><div class="pts">'+
    [5,6,7].filter(function(p){return parts[p].n;}).map(function(p){
      return '<div><span>Partie '+({5:"V · phrases à compléter",6:"VI · textes à trous",7:"VII · compréhension"}[p])+'</span><b>'+parts[p].ok+"/"+parts[p].n+'</b></div>';
    }).join("")+'</div><h2>Par type de question, du plus faible au plus fort</h2><div class="tbs">'+
    tagRows.map(function(t){
      var lv=t.r>=0.8?"hi":t.r>=0.55?"mid":"lo";
      return '<div class="tb" data-lv="'+lv+'"><span>'+esc(t.k)+'</span><div class="bt"><i style="width:'+Math.round(t.r*100)+'%"></i></div><span class="v">'+t.ok+"/"+t.n+'</span></div>';
    }).join("")+'</div></div></section>';
  h+='<div class="review" id="rv"><div class="rvh"><h2>Correction détaillée</h2><div class="seg"><button type="button" data-act="all" aria-pressed="true">Tout</button><button type="button" data-act="wrong" aria-pressed="false">Erreurs ('+wrong+')</button></div></div>';
  h+='<div class="booklet" style="margin-top:16px">';
  S.groups.forEach(function(g){
    if(g.type===7){
      h+='<section class="part"><div class="ph"><p class="kick">Part 7</p><h2>Reading Comprehension</h2></div>';
      g.passages.forEach(function(p){
        var allok=p.qs.every(function(q){return q.good;});
        h+='<div class="pv'+(allok?" allok":"")+'">'+docsHTML(p)+'<ol class="rvl">'+p.qs.map(function(q){return rvHTML(q,true);}).join("")+'</ol></div>';
      });
      h+='</section>';
    }else if(g.type===5){
      h+='<section class="part"><div class="ph"><p class="kick">Part 5</p><h2>Incomplete Sentences</h2></div><ol class="rvl">'+g.qs.map(function(q){return rvHTML(q,true);}).join("")+'</ol></section>';
    }else{
      h+='<section class="part"><div class="ph"><p class="kick">Part 6</p><h2>Text Completion</h2></div>';
      g.passages.forEach(function(p){
        var allok=p.qs.every(function(q){return q.good;});
        h+='<div class="pv'+(allok?" allok":"")+'">'+docHTML(p,true)+'<ol class="rvl">'+p.qs.map(function(q){return rvHTML(q,false);}).join("")+'</ol></div>';
      });
      h+='</section>';
    }
  });
  h+='</div></div><div class="go"><button type="button" class="btn big" data-act="again">Nouvel essai</button></div></div></div>';
  app.innerHTML=h;
  window.scrollTo(0,0);
}

/* Événements */
app.addEventListener("change",function(e){
  var t=e.target;
  if(t.name==="part")setup.part=t.value;
  if(t.name==="pace")setup.pace=t.value;
  if(t.name==="book")setup.book=t.value;
  refreshTimes();
});
app.addEventListener("click",function(e){
  var el=e.target.closest(".opt,[data-jump],[data-part],[data-act]");
  if(!el)return;
  if(el.classList.contains("opt")){pick(el);return;}
  if(el.hasAttribute("data-jump")){goto(+el.getAttribute("data-jump"));return;}
  if(el.hasAttribute("data-part")){var pt=document.getElementById("part"+el.getAttribute("data-part"));if(pt)pt.scrollIntoView({block:"start"});return;}
  var a=el.getAttribute("data-act");
  if(a==="start")startTest();
  else if(a==="again")renderStart();
  else if(a==="tg"){var ck=document.getElementById("ck");var hid=ck.classList.toggle("hid");el.textContent=hid?"Afficher":"Masquer";}
  else if(a==="next"){
    var q=S.qs.filter(function(x){return x.ans===null;})[0];
    if(q)goto(q.n);
    else{el.textContent="Tout est coché";setTimeout(function(){el.textContent="Sans réponse";},1600);}
  }
  else if(a==="fin"){
    var left=S.qs.filter(function(x){return x.ans===null;}).length;
    if(!left)finish(false);
    else{
      document.getElementById("cfn").textContent=left+(left>1?" questions sont sans réponse.":" question est sans réponse.");
      document.getElementById("cf").hidden=false;
    }
  }
  else if(a==="finno")document.getElementById("cf").hidden=true;
  else if(a==="finyes")finish(false);
  else if(a==="all"||a==="wrong"){
    var rv=document.getElementById("rv");rv.classList.toggle("only-wrong",a==="wrong");
    var bs=rv.querySelectorAll(".seg button");
    for(var i=0;i<bs.length;i++)bs[i].setAttribute("aria-pressed",String(bs[i].getAttribute("data-act")===a));
  }
});

renderStart();
})();
</script>

</body></html>
